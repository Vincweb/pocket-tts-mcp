[project]
name = "pocket-tts-mcp"
version = "0.1.0"
description = "MCP server wrapping Kyutai Pocket TTS for Claude Code"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27",
]

[project.scripts]
pocket-tts-mcp = "pocket_tts_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_tts_mcp"]
